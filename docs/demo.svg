  <g fill="#d8dee9" font-family="Consolas,monospace" font-size="16">
    <text x="22" y="58" fill="#88c0d0">moonsql 0.1.0 — pure MoonBit embedded SQL</text>
    <text x="22" y="88"><tspan fill="#a3be8c">moonsql&gt; </tspan>CREATE TABLE users (id INTEGER, name TEXT);</text>
    <text x="22" y="116">OK</text>
    <text x="22" y="146"><tspan fill="#a3be8c">moonsql&gt; </tspan>INSERT INTO users VALUES (1, 'Ada'), (2, 'Linus'), (3, 'Grace');</text>
    <text x="22" y="174">OK</text>
    <text x="22" y="204"><tspan fill="#a3be8c">moonsql&gt; </tspan>SELECT * FROM users WHERE id &gt;= 2 ORDER BY id DESC;</text>
    <text x="22" y="234" fill="#ebcb8b">id | name</text><text x="22" y="260">3 | Grace</text><text x="22" y="286">2 | Linus</text>
    <text x="22" y="316"><tspan fill="#a3be8c">moonsql&gt; </tspan>.tables</text><text x="22" y="342">users</text>
    <text x="22" y="372"><tspan fill="#a3be8c">moonsql&gt; </tspan>.schema users</text><text x="22" y="400">CREATE TABLE users (id INTEGER, name TEXT);</text>
  </g>
</svg>
